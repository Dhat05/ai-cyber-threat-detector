
services:
  api:
    build: .
    container_name: cyber-threat-api
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    restart: unless-stopped

  dashboard:
    build: .
    container_name: cyber-threat-dashboard
    command: streamlit run src/dashboard.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    depends_on:
      - api
    restart: unless-stopped
